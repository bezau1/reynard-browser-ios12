name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust target
        run: |
          rustup target add aarch64-apple-ios
          cargo install cbindgen

      - name: Install ldid
        run: brew install ldid

      - name: Install lld (Firefox cross-linker for iOS target)
        run: |
          brew install lld
          LLD_BIN="$(brew --prefix lld)/bin"
          # Apple clang's -fuse-ld=lld driver looks for a binary literally
          # named ld64.lld; Homebrew's lld formula ships it as `lld` only.
          if [ ! -e "$LLD_BIN/ld64.lld" ] && [ -e "$LLD_BIN/lld" ]; then
            ln -s "$LLD_BIN/lld" "$LLD_BIN/ld64.lld"
          fi
          # Append (not prepend) so Xcode's clang stays primary; only pick up
          # ld64.lld from Homebrew's lld for the -fuse-ld=lld linker check.
          echo "PATH=$PATH:$LLD_BIN" >> "$GITHUB_ENV"

      - name: Read engine release tag
        id: engine
        run: echo "tag=$(tr -d '\000\r' < engine/release.txt | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')" >> "$GITHUB_OUTPUT"

      - name: Restore Gecko build cache
        id: gecko-cache
        uses: actions/cache/restore@v4
        with:
          path: engine/firefox
          key: gecko-${{ runner.os }}-${{ steps.engine.outputs.tag }}-${{ hashFiles('patches/**') }}

      - name: Fetch Gecko source
        if: steps.gecko-cache.outputs.cache-hit != 'true'
        run: zsh tools/development/update-gecko.sh

      - name: Apply patches
        if: steps.gecko-cache.outputs.cache-hit != 'true'
        run: yes "" | zsh tools/development/apply-patches.sh

      - name: Build Gecko
        if: steps.gecko-cache.outputs.cache-hit != 'true'
        run: sh tools/development/build-gecko.sh

      # Save immediately after a successful Gecko build (a ~3hr step) so a
      # failure in a later, unrelated step (e.g. app signing) doesn't cost us
      # the cache. The combined actions/cache action only saves as part of
      # its post-job hook, which does not run reliably if a later step fails.
      - name: Save Gecko build cache
        if: steps.gecko-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: engine/firefox
          key: gecko-${{ runner.os }}-${{ steps.engine.outputs.tag }}-${{ hashFiles('patches/**') }}

      - name: Build idevice FFI library (JIT support)
        run: zsh tools/development/build-idevice.sh

      - name: Disable code signing for CI archive
        run: |
          # The Gecko build's ldid re-signs the app for jailbroken/TrollStore
          # install afterward (see create-ipa.sh); the initial archive step
          # doesn't need real Apple Developer signing, which isn't available
          # on a CI runner anyway.
          cat >> browser/Configuration/Reynard.xcconfig <<'EOF'
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          CODE_SIGN_IDENTITY =
          EOF
          # AddGecko.sh's own codesign fallback defaults to "Apple Development"
          # when EXPANDED_CODE_SIGN_IDENTITY(_NAME) are empty, which doesn't
          # exist in a CI keychain either. Use ad-hoc signing ("-") instead;
          # this is a runtime-only patch to this checkout, not committed.
          sed -i '' 's/Apple Development"/-"/' browser/Scripts/AddGecko.sh

      - name: Build app
        run: sh tools/release/build-app.sh

      - name: Create IPA
        run: sh tools/release/create-ipa.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-ios12-build
          path: |
            dist/*.ipa
            dist/*.tipa
          if-no-files-found: error
