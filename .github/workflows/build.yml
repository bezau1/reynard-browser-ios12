name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust target
        run: |
          rustup target add aarch64-apple-ios

      - name: Install ldid
        run: brew install ldid

      - name: Install lld (Firefox cross-linker for iOS target)
        run: |
          brew install lld
          LLD_BIN="$(brew --prefix lld)/bin"
          # Apple clang's -fuse-ld=lld driver looks for a binary literally
          # named ld64.lld; Homebrew's lld formula ships it as `lld` only.
          if [ ! -e "$LLD_BIN/ld64.lld" ] && [ -e "$LLD_BIN/lld" ]; then
            ln -s "$LLD_BIN/lld" "$LLD_BIN/ld64.lld"
          fi
          # Append (not prepend) so Xcode's clang stays primary; only pick up
          # ld64.lld from Homebrew's lld for the -fuse-ld=lld linker check.
          echo "PATH=$PATH:$LLD_BIN" >> "$GITHUB_ENV"

      - name: Diagnose linker probe
        run: |
          export PATH="$PATH:$(brew --prefix lld)/bin"
          which ld64.lld && ld64.lld --version
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          COMMON="-isysroot $SDK -mios-version-min=12.4 --target=aarch64-apple-ios"
          LD_PRINT_OPTIONS=1 LC_ALL=C clang $COMMON -fuse-ld=lld -Wl,--version; echo "retcode=$?"
          exit 1

      - name: Read engine release tag
        id: engine
        run: echo "tag=$(tr -d '\000\r' < engine/release.txt | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')" >> "$GITHUB_OUTPUT"

      - name: Cache Gecko build
        id: gecko-cache
        uses: actions/cache@v4
        with:
          path: engine/firefox
          key: gecko-${{ runner.os }}-${{ steps.engine.outputs.tag }}-${{ hashFiles('patches/**') }}

      - name: Fetch Gecko source
        if: steps.gecko-cache.outputs.cache-hit != 'true'
        run: zsh tools/development/update-gecko.sh

      - name: Apply patches
        if: steps.gecko-cache.outputs.cache-hit != 'true'
        run: yes "" | zsh tools/development/apply-patches.sh

      - name: Build Gecko
        if: steps.gecko-cache.outputs.cache-hit != 'true'
        run: sh tools/development/build-gecko.sh

      - name: Build app
        run: sh tools/release/build-app.sh

      - name: Create IPA
        run: sh tools/release/create-ipa.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reynard-ios12-build
          path: |
            dist/*.ipa
            dist/*.tipa
          if-no-files-found: error
